[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geopulse"
version = "0.0.1"
description = "GeoPulse geospatial real-time platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["geopulse"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["geopulse"]